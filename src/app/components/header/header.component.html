<header class="app-header">
    <div class="header-content">
        <!-- Left Section - Breadcrumb Navigation -->
        <div class="header-left">
            <nav class="breadcrumb">
                <div *ngFor="let crumb of breadcrumbs; let last = last" class="breadcrumb-wrapper">
                    <a [routerLink]="crumb.url" class="breadcrumb-item" [class.active]="last">
                        <span *ngIf="crumb.icon" class="breadcrumb-icon" [innerHTML]="getSafeIcon(crumb.icon)"></span>
                        <span class="breadcrumb-label">{{ crumb.label }}</span>
                    </a>
                    <svg *ngIf="!last" class="breadcrumb-separator" width="12" height="12" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </nav>
        </div>

        <!-- Right Section - User Info & Actions -->
        <div class="header-right">
            <!-- Theme Toggle -->
            <button class="header-action-btn theme-toggle" (click)="toggleTheme()"
                [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
                <!-- Sun Icon (Light Mode) -->
                <svg *ngIf="isDarkMode" class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <!-- Moon Icon (Dark Mode) -->
                <svg *ngIf="!isDarkMode" class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <!-- Notifications -->
            <button class="header-action-btn" title="Notifications">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="notification-badge">3</span>
            </button>

            <!-- User Profile Dropdown -->
            <div class="user-profile" *ngIf="currentUser">
                <div class="user-info-container" (click)="toggleDropdown()">
                    <div class="user-avatar">
                        {{ getUserInitials() }}
                    </div>
                    <div class="user-details">
                        <div class="user-name">{{ currentUser.name }}</div>
                        <div class="user-role">{{ currentUser.role.label || currentUser.role }}</div>
                    </div>
                    <svg class="dropdown-icon" [class.open]="isDropdownOpen" width="16" height="16" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>

                <!-- Dropdown Menu -->
                <div class="dropdown-menu" *ngIf="isDropdownOpen">
                    <div class="dropdown-header">
                        <div class="dropdown-user-avatar">
                            {{ getUserInitials() }}
                        </div>
                        <div class="dropdown-user-info">
                            <div class="dropdown-user-name">{{ currentUser.name }}</div>
                            <div class="dropdown-user-email">{{ currentUser.email }}</div>
                            <div class="dropdown-user-role">
                                <span class="role-badge" [class]="'role-' + (currentUser.role.name || 'sales')">
                                    {{ currentUser.role.label || currentUser.role }}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="dropdown-divider"></div>

                    <a class="dropdown-item" routerLink="/profile" (click)="closeDropdown()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>My Profile</span>
                    </a>

                    <a class="dropdown-item" routerLink="/settings" (click)="closeDropdown()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2 5.2l-4.2-4.2m-6 0l-4.2 4.2">
                            </path>
                        </svg>
                        <span>Settings</span>
                    </a>

                    <div class="dropdown-divider"></div>

                    <button class="dropdown-item logout-item" (click)="logout()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- Dropdown Overlay -->
<div class="dropdown-overlay" *ngIf="isDropdownOpen" (click)="closeDropdown()"></div>
