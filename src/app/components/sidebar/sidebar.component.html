<div class="sidebar" [class.collapsed]="isCollapsed">
    <!-- Sidebar Header -->
    <div class="sidebar-header">
        <div class="logo">
            <div class="logo-icon" *ngIf="organizationLogo; else defaultIcon">
                <img [src]="organizationLogo" class="org-logo">
            </div>
            <ng-template #defaultIcon>
                <span class="logo-icon">🏢</span>
            </ng-template>
        </div>
        <button class="toggle-btn" (click)="toggleSidebar()"
            [attr.aria-label]="isCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav">
        <a *ngFor="let item of getVisibleMenuItems()" [routerLink]="item.route" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" class="nav-item" [attr.title]="isCollapsed ? item.label : null">
            <span class="nav-icon" [innerHTML]="item.icon"></span>
            <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>
        </a>
    </nav>

    <!-- Logout Button -->
    <div class="sidebar-footer">
        <button class="nav-item logout-btn" (click)="logout()" [attr.title]="isCollapsed ? 'Logout' : null">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </span>
            <span class="nav-label" *ngIf="!isCollapsed">Logout</span>
        </button>
    </div>
</div>

<!-- Mobile Overlay -->
<div class="sidebar-overlay" *ngIf="!isCollapsed && isMobile" (click)="toggleSidebar()"></div>
