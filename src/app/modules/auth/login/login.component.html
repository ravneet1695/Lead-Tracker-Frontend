<div class="login-container">
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="login-card card-glass fade-in-up">
        <div class="login-header">
            <div class="logo-container">
                <div class="logo-icon pulse">🎯</div>
            </div>
            <h1 class="gradient-text">Goal Tracking System</h1>
            <p class="subtitle">Sign in to continue your journey</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="login-form">
            <!-- Email Field with Floating Label -->
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" [(ngModel)]="credentials.email" name="email"
                    required placeholder=" " [class.error]="error" (focus)="error = ''">
                <label for="email">Email Address</label>
                <div class="input-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
            </div>

            <!-- Password Field with Floating Label and Toggle -->
            <div class="form-floating mb-3">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password"
                    [(ngModel)]="credentials.password" name="password" required placeholder=" " [class.error]="error"
                    (focus)="error = ''">
                <label for="password">Password</label>
                <div class="input-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <button type="button" class="password-toggle" (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                    <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path
                            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                        </path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>

            <!-- Session Expired Alert -->
            <div *ngIf="sessionExpired" class="alert alert-warning slide-in-left">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>Your session has expired. Please log in again.</span>
            </div>

            <!-- Error Alert -->
            <div *ngIf="error" class="alert alert-danger slide-in-left">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
                <span>{{ error }}</span>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-login" [disabled]="loading">
                <span *ngIf="!loading">Sign In</span>
                <span *ngIf="loading" class="loading-content">
                    <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                    <span>Signing in...</span>
                </span>
            </button>
        </form>

        <!-- Demo Credentials -->
        <div class="demo-credentials">
            <div class="divider">
                <span>Demo Credentials</span>
            </div>
            <div class="credentials-grid">
                <div class="credential-card" (click)="fillCredentials('admin@system.com', 'Admin@123')">
                    <div class="credential-badge badge-admin">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                            <path d="M2 17l10 5 10-5M2 12l10 5 10-5"></path>
                        </svg>
                        Super Admin
                    </div>
                    <div class="credential-info">
                        <small>admin&#64;system.com</small>
                        <small class="password-hint">Admin&#64;123</small>
                    </div>
                </div>

                <div class="credential-card" (click)="fillCredentials('ga@gmoney.loans', 'Ravneet@123')">
                    <div class="credential-badge badge-org-admin">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        Org Admin
                    </div>
                    <div class="credential-info">
                        <small>ga&#64;gmoney.loans</small>
                        <small class="password-hint">Ravneet&#64;123</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
